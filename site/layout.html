<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <script>
      // Before first paint: a hook for script-only controls.
      document.documentElement.classList.add("js");
    </script>
    <link rel="canonical" href="{{canonical}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fafaf9" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FeedbackBee" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{ogDescription}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/site.css" />
    <script type="application/ld+json">
      {{jsonld}}
    </script>
  </head>
  <body>
    <header class="container nav">
      <a class="logo" href="/" aria-label="FeedbackBee home">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <path
            class="hex"
            d="M16 2.8 27.4 9.4v13.2L16 29.2 4.6 22.6V9.4z"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            class="bubble"
            d="M11 12.5h10a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5h-4.2L14 22.6v-2.1h-3A1.5 1.5 0 0 1 9.5 19v-5a1.5 1.5 0 0 1 1.5-1.5z"
          />
        </svg>
        FeedbackBee
      </a>
      <nav class="navlinks" aria-label="Main">
        <a class="opt" href="/#features">Features</a>
        <a href="https://github.com/AshikNesin/feedbackbee#readme">Docs</a>
        <a href="https://github.com/AshikNesin/feedbackbee" aria-label="FeedbackBee on GitHub"
          >GitHub</a
        >
        <a href="/app/login">Sign in</a>
      </nav>
    </header>

    <main>{{content}}</main>

    <footer class="footer">
      <div class="container">
        <a class="logo" href="/" aria-label="FeedbackBee home">
          <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
            <path
              class="hex"
              d="M16 2.8 27.4 9.4v13.2L16 29.2 4.6 22.6V9.4z"
              stroke-width="3"
              stroke-linejoin="round"
            />
            <path
              class="bubble"
              d="M11 12.5h10a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5h-4.2L14 22.6v-2.1h-3A1.5 1.5 0 0 1 9.5 19v-5a1.5 1.5 0 0 1 1.5-1.5z"
            />
          </svg>
          FeedbackBee
        </a>
        <ul class="footer-links">
          <li><a href="https://github.com/AshikNesin/feedbackbee#readme">Docs</a></li>
          <li><a href="https://github.com/AshikNesin/feedbackbee">GitHub</a></li>
          <li><a href="https://github.com/AshikNesin/feedbackbee/issues">Issues</a></li>
        </ul>
        <p class="legal">Open source, MIT licensed.</p>
      </div>
    </footer>
    <script src="/site.js" defer></script>
  </body>
</html>
