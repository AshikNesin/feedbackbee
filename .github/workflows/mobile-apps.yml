# FeedbackBee's own mobile apps: mobile/android (Kotlin + Compose) and
# mobile/ios (SwiftUI + the FeedbackBeeCore package).
# App-owned: listed in .groot/boilerplate-sync.json additional_exclusions.
name: Mobile apps

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["mobile/**", ".github/workflows/mobile-apps.yml"]
  push:
    branches: ["main"]
    paths: ["mobile/**", ".github/workflows/mobile-apps.yml"]

permissions:
  contents: read

concurrency:
  group: mobile-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Caches the Gradle distribution and dependencies between runs, so a slow or
      # flaky download (services.gradle.org, Maven Central) rarely fails the job.
      - uses: gradle/actions/setup-gradle@v4
      # Resolve Maven Central artifacts through Google's mirror first: Central
      # redirects some Kotlin jars to GitHub release downloads, which can 504.
      - name: Maven Central mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/central-mirror.gradle.kts" <<'KTS'
          beforeSettings {
              val mirror = "https://maven-central.storage-download.googleapis.com/maven2/"
              pluginManagement.repositories { maven(mirror) }
              dependencyResolutionManagement.repositories { maven(mirror) }
          }
          allprojects {
              tasks.withType<Test>().configureEach {
                  systemProperty("robolectric.dependency.repo.url", "https://maven-central.storage-download.googleapis.com/maven2/")
              }
          }
          KTS
      - name: Unit and screen tests (writes screenshots), release build (R8) and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:lintRelease
        env:
          FEEDBACKBEE_SCREENSHOT_DIR: ${{ runner.temp }}/android-screens
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-app-screens
          path: ${{ runner.temp }}/android-screens
          if-no-files-found: warn

  ios:
    name: iOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v5
      - name: Core tests (models, API client, stores)
        working-directory: mobile/ios/Core
        run: swift test
      - name: Build the app and take simulator screenshots
        run: ./screenshots.sh "$RUNNER_TEMP/ios-screens"
      - name: Release build
        run: >
          xcodebuild build -project FeedbackBee.xcodeproj -scheme FeedbackBee -configuration Release
          -destination "generic/platform=iOS Simulator" -derivedDataPath build-release -quiet
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-screens
          path: ${{ runner.temp }}/ios-screens
          if-no-files-found: warn
